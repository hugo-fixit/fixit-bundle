# Custom partials must be stored in the /layouts/_partials/ directory.
# Depends on open custom blocks https://fixit.lruihao.cn/references/blocks/.
[params]

[params.custom_partials]
head = [
  "inject/component-projects.html",
  "inject/fixit-docs-bookmark.html",
  "inject/shortcode-rewards.html",
]
menu_desktop = ["inject/translate-menu-desktop.html"]
menu_mobile = ["inject/translate-menu-mobile.html"]
profile = []
aside = []
comment = []
footer = []
widgets = []
assets = [
  "inject/santa-hat.fixit.html",
  "inject/cmpt-flyfish",
  "inject/cmpt-mdevtools",
  "inject/cmpt-translate.html",
  "inject/shortcode-caniuse.html",
]
post_footer_before = []
post_footer_after = []

[outputs]
_merge="shallow"

[taxonomies]
_merge="shallow"

[markup]
_merge="shallow"

[module]

[[module.imports]]
path="github.com/hugo-fixit/FixIt"
version="main"

[[module.imports]]
path="github.com/hugo-fixit/component-projects/v2"

[[module.imports]]
path="github.com/hugo-fixit/cmpt-flyfish"

[[module.imports]]
path="github.com/hugo-fixit/cmpt-mdevtools"

[[module.imports]]
path="github.com/hugo-fixit/cmpt-santa-hat"

[[module.imports]]
path="github.com/hugo-fixit/cmpt-translate/v2"

[[module.imports]]
path="github.com/hugo-fixit/hugo-atom-feed"

[[module.imports]]
path="github.com/hugo-fixit/hugo-json-feed"

[[module.imports]]
path="github.com/hugo-fixit/shortcode-asciinema"

[[module.imports]]
path="github.com/hugo-fixit/shortcode-caniuse"

[[module.imports]]
path="github.com/hugo-fixit/shortcode-docs-bookmark/v2"

[[module.imports]]
path="github.com/hugo-fixit/shortcode-missing-translation"

[[module.imports]]
path="github.com/hugo-fixit/shortcode-mmt-netease"

[[module.imports]]
path="github.com/hugo-fixit/shortcode-rewards/v2"
